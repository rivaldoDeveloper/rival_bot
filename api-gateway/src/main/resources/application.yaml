server:
  port: 8080 # A porta única que o seu Frontend vai chamar

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200" # Libera o Angular
            allowedMethods: "*"
            allowedHeaders: "*"
      routes:
        - id: auth-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**, /api/tenants/**
          filters:
            - AuthenticationFilter # ATIVAMOS A SEGURANÇA AQUI!

        - id: chatbot-api
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/chat/**, /api/v1/flow/**
          filters:
            - AuthenticationFilter # ATIVAMOS A SEGURANÇA AQUI!

        - id: helpdesk-bff
          uri: http://localhost:8084
          predicates:
            - Path=/api/bff/**
          filters:
            - AuthenticationFilter

