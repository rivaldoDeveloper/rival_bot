server:
  port: 8080

jwt:
  secret: "ChaveSecretaSuperSeguraComMaisDe32CaracteresRivalChat2026!"

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 50MB
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:4200"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: chatbot-websocket
          uri: ws://localhost:8083
          predicates:
            - Path=/ws-chat/**

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**

        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/tenants/**

        - id: chatbot-files
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/files/**

        - id: chatbot-api
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/**

        - id: user-service-payments
          uri: http://localhost:8081
          predicates:
            - Path=/api/payments/**

        - id: helpdesk-bff
          uri: http://localhost:8084
          predicates:
            - Path=/api/bff/**