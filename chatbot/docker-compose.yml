services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api_local
    restart: always
    ports:
      - "8081:8080"
    environment:
      # Configurações do Servidor
      - SERVER_URL=http://localhost:8081
      - CORS_ORIGIN=*
      - CORS_METHODS=POST,GET,PUT,DELETE

      # Autenticação
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=sua_chave_global_aqui

      # Base de Dados (PostgreSQL)
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres123@postgres-evo:5432/evolution?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution_api

      # Configuração Obrigatória do Redis (Resolve o erro "redis disconnected")
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis-evo:6379/6
      - CACHE_REDIS_PREFIX_KEY=evo
      - CACHE_LOCAL_ENABLED=false

      # Webhook Global
      - WEBHOOK_GLOBAL_ENABLED=false

    depends_on:
      - postgres-evo
      - redis-evo
    volumes:
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

  # Contentor PostgreSQL
  postgres-evo:
    image: postgres:15-alpine
    container_name: postgres_evo_local
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres123
      - POSTGRES_DB=evolution
    ports:
      - "5433:5432"
    volumes:
      - postgres_evo_data:/var/lib/postgresql/data

  # NOVO: Contentor Redis
  redis-evo:
    image: redis:alpine
    container_name: redis_evo_local
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_evo_data:/data

volumes:
  evolution_instances:
  evolution_store:
  postgres_evo_data:
  redis_evo_data: