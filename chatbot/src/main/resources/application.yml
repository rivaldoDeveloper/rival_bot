server:
  port: 8083

spring:
  application:
    name: chatbot-api

  datasource:
    url: ${JDBC_POSTGRES:jdbc:postgresql://ep-still-union-ae9q1fgu-pooler.c-2.us-east-2.aws.neon.tech/neondb?sslmode=require&reWriteBatchedInserts=true&connectTimeout=60&socketTimeout=60&loginTimeout=60}
    username: ${NEON_DB_USER:neondb_owner}
    password: ${NEON_DB_PASSWORD:npg_lZhcVq9WadG0}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 60000
      validation-timeout: 10000
      max-lifetime: 240000
      keepalive-time: 30000
      minimum-idle: 1
      maximum-pool-size: 5
      initialization-fail-timeout: 60000

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true

  ai:
    openai:
      api-key: ${GEMINI_API_KEY:chave_ficticia_teste}
      base-url: "https://generativelanguage.googleapis.com/v1beta/openai"
      chat:
        options:
          model: "gemini-1.5-flash"
          temperature: 0.7

whatsapp:
  api:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:meu_token_secreto_123}

tesseract:
